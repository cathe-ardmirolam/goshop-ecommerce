<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="css/global-style.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <script src="js/app.js"></script>
    <title>GOShop</title>
  </head>
  <body>
    <main>
      <header class="navbar">
          <div class="logo-section">
            <img class="principal-logo" src="images/principal-logo.svg" alt="pricipal-logo"/>
          </div>
          <div class="search-bar">
            <input type="text" placeholder="Search" />
            <button class="search-button">
              <img class="search-icon" src="images/search-icon.svg" alt="search-icon"/>
            </button>
          </div>
          <div class="cart-section">
            <img class="shopping-cart" src="images/shopping-cart.svg" alt="shopping-cart"
            />
          </div>
      </header>
    </main>
  </body>
</html>
